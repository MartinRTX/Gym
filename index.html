<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6D3BE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym Martin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #F5F3FA; --card: #FFFFFF; --card2: #F8F6FD; --text: #1A1530; --muted: #6B6680;
    --line: #E6E1F0; --pri: #6D3BE8; --pri-2: #8B5CF6; --pri-weak: #EFE9FD; --on-pri: #FFFFFF;
    --acc: #F2762E; --acc-weak: #FFF0E5; --on-acc: #FFFFFF;
    --ok: #1F9D55; --ok-weak: #E4F6EC; --bad: #D64545;
    --shadow: 0 1px 2px rgba(40, 20, 90, .06), 0 4px 16px rgba(40, 20, 90, .05);
    --nav-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E0C14; --card: #18151F; --card2: #1F1B2A; --text: #EEEAF7; --muted: #A29CB6;
      --line: #2B2638; --pri: #9B7BFF; --pri-2: #B49CFF; --pri-weak: #2A2142; --on-pri: #0E0C14;
      --acc: #FF9A55; --acc-weak: #3A2618; --on-acc: #1A0F07;
      --ok: #4ADE80; --ok-weak: #15301F; --bad: #F87171;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         padding-top: env(safe-area-inset-top); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 12px 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom)); }
  .num { font-variant-numeric: tabular-nums; }

  /* Encabezado */
  .top { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 2px; }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .brand span { color: var(--pri); }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .sync { font-size: 12px; padding: 5px 10px; border-radius: 99px; background: var(--card2); color: var(--muted); white-space: nowrap; }
  .sync.pend { background: var(--acc-weak); color: var(--acc); font-weight: 700; }
  .sync.ok { background: var(--ok-weak); color: var(--ok); }

  /* Tarjetas y textos */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .muted { color: var(--muted); font-size: 13px; }
  .t1 { font-weight: 700; font-size: 16px; }
  .t2 { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  h2 { font-size: 12px; color: var(--muted); font-weight: 700; margin: 20px 4px 8px; text-transform: uppercase; letter-spacing: .08em; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; }
  .pill.acc { background: var(--acc-weak); color: var(--acc); }
  .pill.pri { background: var(--pri-weak); color: var(--pri); }
  .pill.ok { background: var(--ok-weak); color: var(--ok); }
  .pill.muted { background: var(--card2); color: var(--muted); }
  .btn { border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 16px; background: var(--pri); color: var(--on-pri); }
  .btn.ghost { background: var(--card2); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .btn.acc { background: var(--acc); color: var(--on-acc); }
  .btn.sm { padding: 9px 13px; font-size: 14px; border-radius: 11px; }
  .btn.block { width: 100%; }
  .icon { width: 20px; height: 20px; flex: none; }

  /* Peso compacto */
  .peso { display: flex; align-items: center; gap: 10px; }
  .peso .lbl { flex: 1; min-width: 0; }
  .in { width: 92px; padding: 11px 8px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 18px; font-weight: 700;
        text-align: center; background: var(--card2); color: var(--text); }
  .in:focus { outline: none; border-color: var(--pri); }
  .okmark { width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--pri); color: var(--on-pri); display: grid; place-items: center; }
  .done-card { border-color: transparent; background: var(--ok-weak); box-shadow: none; }
  .done-card .okmark { background: var(--ok); }

  /* Grupos */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
  .chip { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 9px 16px; font-weight: 600; font-size: 15px; }
  .chip.on { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
  .chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 9px; background: var(--acc); margin-left: 6px; vertical-align: middle; }

  /* Ejercicios */
  .ex { background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .ex-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .ex-ico { width: 38px; height: 38px; border-radius: 12px; background: var(--pri-weak); color: var(--pri); display: grid; place-items: center; flex: none; font-weight: 800; font-size: 14px; }
  .ex.done .ex-ico { background: var(--ok-weak); color: var(--ok); }
  .ex.prog .ex-ico { background: var(--acc-weak); color: var(--acc); }
  .ex-name { font-weight: 700; font-size: 15.5px; line-height: 1.25; }
  .ex-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ex.open { border-color: var(--pri); box-shadow: 0 0 0 1px var(--pri), var(--shadow); }
  .ex-body { padding: 0 16px 16px; }
  .tip { display: flex; gap: 8px; align-items: center; font-size: 13.5px; padding: 9px 12px; border-radius: 12px; background: var(--card2); color: var(--muted); margin: 2px 0 10px; }
  .tip.acc { background: var(--acc-weak); color: var(--acc); font-weight: 700; }
  .unit { display: flex; border: 1.5px solid var(--line); border-radius: 11px; overflow: hidden; flex: none; }
  .unit button { border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 700; padding: 7px 14px; min-width: 48px; }
  .unit button.on { background: var(--pri); color: var(--on-pri); }

  .sets-h { display: grid; grid-template-columns: 26px 1fr 1fr 48px; gap: 8px; color: var(--muted); font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .06em; padding: 0 2px 4px; }
  .set { display: grid; grid-template-columns: 26px 1fr 1fr 48px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .set .n { color: var(--muted); font-weight: 700; font-size: 14px; text-align: center; }
  .stp { display: flex; align-items: stretch; height: 48px; border-radius: 12px; background: var(--card2); border: 1.5px solid var(--line); overflow: hidden; }
  .stp button { width: 34px; border: 0; background: transparent; color: var(--muted); font-size: 20px; flex: none; }
  .stp input { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--text); text-align: center; font-size: 19px; font-weight: 800; padding: 0; }
  .stp input:focus { outline: none; }
  .stp input::placeholder { color: var(--muted); font-weight: 500; font-size: 14px; }
  .chk { width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card2); color: var(--muted); display: grid; place-items: center; }
  .set.hecho .stp { background: var(--pri-weak); border-color: transparent; }
  .set.hecho .chk { background: var(--pri); border-color: var(--pri); color: var(--on-pri); animation: pop .25s ease; }
  @keyframes pop { 50% { transform: scale(1.12); } }
  .more { margin-top: 6px; }
  .more summary { color: var(--muted); font-size: 13px; padding: 6px 0; list-style: none; }
  .more summary::before { content: "＋ "; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .pills button { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 11px; font-size: 13px; }
  .pills button.on { background: var(--pri); color: var(--on-pri); border-color: var(--pri); }
  textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; background: var(--card2); color: var(--text); font: inherit; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .acts .btn { flex: 1; }

  /* Sesión */
  .session { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 16px;
             background: linear-gradient(135deg, var(--pri), var(--pri-2)); color: var(--on-pri); margin-bottom: 12px; }
  .session b { font-size: 20px; }
  .session .btn { background: rgba(255,255,255,.18); color: inherit; }

  /* Temporizador de descanso */
  .rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));
          width: min(488px, calc(100% - 24px)); background: var(--text); color: var(--bg); border-radius: 18px; padding: 10px 12px;
          box-shadow: 0 8px 30px rgba(0,0,0,.25); z-index: 20; display: none; }
  .rest.show { display: block; animation: up .2s ease; }
  @keyframes up { from { transform: translate(-50%, 12px); opacity: 0; } }
  .rest .rbtn { border: 0; background: rgba(127,127,127,.22); color: inherit; border-radius: 10px; padding: 9px 0; font-weight: 700; font-size: 14px; flex: 1; }
  .rest .big { font-size: 26px; font-weight: 800; }
  .rest.fin { background: var(--acc); color: var(--on-acc); }
  .rbar { height: 4px; background: rgba(127,127,127,.3); border-radius: 9px; overflow: hidden; margin-top: 8px; }
  .rbar div { height: 100%; background: var(--acc); }
  .switch { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .85; }

  /* Comida */
  .ring { display: grid; place-items: center; position: relative; width: 170px; height: 170px; margin: 4px auto 6px; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .v { font-size: 34px; font-weight: 800; }
  .foods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .food { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 12px; position: relative; }
  .food b { display: block; color: var(--pri); font-size: 15px; }
  .food .c { position: absolute; top: 8px; right: 10px; font-size: 12px; font-weight: 800; color: var(--acc); }
  .food.top { border-color: var(--pri); background: var(--pri-weak); }
  .eaten { display: flex; flex-wrap: wrap; gap: 6px; }
  .eaten button { border: 0; background: var(--card2); border-radius: 99px; padding: 6px 10px; font-size: 13px; color: var(--text); }

  /* Progreso */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .kpi .l { color: var(--muted); font-size: 12.5px; }
  .kpi .d { font-size: 12.5px; font-weight: 700; margin-top: 4px; color: var(--muted); }
  .kpi .d.good { color: var(--ok); }
  .week { display: flex; justify-content: space-between; margin-top: 12px; }
  .week div { width: 36px; text-align: center; font-size: 12px; color: var(--muted); }
  .week i { display: block; width: 30px; height: 30px; border-radius: 10px; margin: 0 auto 4px; background: var(--card2); border: 1.5px solid var(--line); }
  .week .y i { background: var(--pri); border-color: var(--pri); }
  .week .hoy { color: var(--text); font-weight: 800; }
  .rec { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .rec:first-of-type { border-top: 0; }
  .medal { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--acc-weak); color: var(--acc); flex: none; }
  .mus { padding: 11px 0; border-top: 1px solid var(--line); }
  .mus:first-of-type { border-top: 0; }
  .mbar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 7px; }
  .mbar div { height: 100%; border-radius: 99px; background: var(--pri); }
  .mbar div.ok { background: var(--ok); }
  .up { color: var(--ok); } .down { color: var(--bad); }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .ax { fill: var(--muted); font-size: 10px; }
  .chart .grid { stroke: var(--line); }
  .chart .avg { fill: none; stroke: var(--pri); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .chart .pt { fill: var(--pri); opacity: .28; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 14px; height: 4px; border-radius: 4px; background: var(--pri); vertical-align: middle; margin-right: 5px; }
  .legend i.p { width: 7px; height: 7px; opacity: .35; }

  /* Navegación inferior */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
         padding-bottom: env(safe-area-inset-bottom); z-index: 30; }
  .nav .in2 { max-width: 520px; margin: 0 auto; display: flex; height: var(--nav-h); }
  .nav button { flex: 1; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; }
  .nav button.on { color: var(--pri); }
  .nav button.on .icon { transform: scale(1.08); }

  /* Ventana de resumen de sesión */
  .modal { position: fixed; inset: 0; background: rgba(10, 6, 25, .55); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal.show { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); animation: up2 .25s ease; }
  @keyframes up2 { from { transform: translateY(40px); opacity: 0; } }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .stats div { background: var(--card2); border-radius: 14px; padding: 12px 8px; text-align: center; }
  .stats b { display: block; font-size: 22px; font-weight: 800; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top)); background: var(--text); color: var(--bg);
           padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  .toast.pr { background: var(--acc); color: var(--on-acc); }
  #loading { text-align: center; padding: 80px 0; color: var(--muted); }
  #setup input { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; background: var(--card2); color: var(--text); margin: 6px 0 12px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">Cargando…</div>

  <div id="setup" class="hide">
    <div class="brand" style="margin:10px 0">Gym <span>Martin</span></div>
    <p class="muted">Solo se hace una vez. Lo más fácil es abrir el link de configuración; si no, pega aquí los dos datos.</p>
    <div class="card">
      <div class="t1">URL de la API</div>
      <input id="cfgApi" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
      <div class="t1">Clave</div>
      <input id="cfgKey" placeholder="Clave secreta" autocomplete="off">
      <button class="btn block" onclick="guardarConfig()">Guardar</button>
    </div>
  </div>

  <div id="app" class="hide">
    <div class="top"><div class="brand">Gym <span>Martin</span></div><span id="sync" class="sync"></span></div>
    <div class="sub" id="fecha"></div>
    <div id="vEntrenar"></div>
    <div id="vComida" class="hide"></div>
    <div id="vProgreso" class="hide"></div>
  </div>
</div>

<div class="rest" id="rest"></div>

<nav class="nav hide" id="nav"><div class="in2">
  <button id="nEntrenar" class="on" onclick="verTab('Entrenar')">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Entrenar</button>
  <button id="nComida" onclick="verTab('Comida')">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4 0-7-3.5-7-8 0-3.5 2.2-6 5-6 1 0 1.5.5 2 .5s1-.5 2-.5c2.8 0 5 2.5 5 6 0 4.5-3 8-7 8z"/><path d="M12 7c0-2 1-3.5 3-4"/></svg>Comida</button>
  <button id="nProgreso" onclick="verTab('Progreso')">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>Progreso</button>
</div></nav>

<div class="modal" id="modal" onclick="if(event.target===this)cerrarModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
