<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym Martin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #F4F5F7; --card: #FFFFFF; --text: #1B1F24; --muted: #6B7280;
    --line: #E3E6EA; --accent: #1F3864; --accent-text: #FFFFFF;
    --ok: #1E7B3A; --ok-bg: #E3F4E8; --warn-bg: #FFF4D6; --warn: #8A5A00;
    --chip: #E8ECF2; --bar: #2E7D4F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1115; --card: #1A1D23; --text: #ECEEF1; --muted: #9AA1AC;
      --line: #2A2E36; --accent: #6E9BFF; --accent-text: #0F1115;
      --ok: #6FD08C; --ok-bg: #16301F; --warn-bg: #3A2E10; --warn: #F2C55C;
      --chip: #262A32; --bar: #6FD08C;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 80px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 18px 2px 8px;
       text-transform: uppercase; letter-spacing: .04em; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 14px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .muted { color: var(--muted); font-size: 13px; }
  .hint { font-size: 13px; padding: 6px 10px; border-radius: 8px; margin: 8px 0; background: var(--chip); }
  .hint.up { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 4px; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 9px 16px; font-size: 15px;
          background: var(--chip); color: var(--text); }
  .chip.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .chip.sug::after { content: " ★"; }
  .ex-title { font-weight: 600; font-size: 16px; }
  .ex-head { cursor: pointer; }
  .chev { color: var(--muted); font-size: 18px; }
  .set { display: grid; grid-template-columns: 28px 1fr 18px 1fr; gap: 6px; align-items: center; margin-top: 6px; }
  .set .n { color: var(--muted); font-size: 13px; }
  .stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .stepper button { width: 38px; border: 0; background: var(--chip); color: var(--text); font-size: 20px; }
  .stepper input { width: 100%; min-width: 0; border: 0; text-align: center; font-size: 17px;
                   background: var(--card); color: var(--text); padding: 8px 0; }
  .x { text-align: center; color: var(--muted); }
  .unit { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .unit button { border: 0; background: var(--card); color: var(--muted); font-size: 15px;
                 padding: 9px 16px; min-width: 52px; }
  .unit button.on { background: var(--accent); color: var(--accent-text); font-weight: 700; }
  .mus { padding: 10px 0; border-top: 1px solid var(--line); }
  .mus:first-of-type { border-top: 0; }
  .mus .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
  .mus .pct.up { color: var(--ok); }
  .mus .pct.down { color: #C0392B; }
  .mbar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 6px; position: relative; }
  .mbar > div { height: 100%; border-radius: 99px; background: var(--accent); }
  .mbar > div.ok { background: var(--bar); }
  .pills { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .pills button { border: 1px solid var(--line); background: var(--card); color: var(--text);
                  border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .pills button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .save { flex: 1; border: 0; border-radius: 10px; padding: 13px; font-size: 16px; font-weight: 600;
          background: var(--accent); color: var(--accent-text); }
  .ghost { border: 1px solid var(--line); background: transparent; color: var(--text);
           border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .done { background: var(--ok-bg); border-color: transparent; }
  .done .ex-title::before { content: "✓ "; color: var(--ok); }
  .small-in { width: 100px; padding: 10px; border: 1px solid var(--line); border-radius: 10px;
              font-size: 17px; text-align: center; background: var(--card); color: var(--text); }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
           font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
  .toast.show { opacity: 1; }
  details summary { color: var(--muted); font-size: 13px; margin-top: 8px; }
  textarea { width: 100%; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px;
             padding: 8px; background: var(--card); color: var(--text); font: inherit; }
  #loading { text-align: center; padding: 60px 0; color: var(--muted); }
  .tabs { display: flex; background: var(--chip); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 9px;
                 border-radius: 9px; font-size: 15px; }
  .tabs button.on { background: var(--card); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .bar { height: 10px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; background: var(--bar); border-radius: 99px; transition: width .2s; }
  .foods { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .foods button { text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--text);
                  border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.25; }
  .foods button b { display: block; font-size: 14px; }
  .foods button .cnt { float: right; color: var(--ok); font-weight: 700; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .kpi .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 13px; }
  .kpi .d { font-size: 13px; margin-top: 2px; }
  .kpi .d.good { color: var(--ok); }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .axis { fill: var(--muted); font-size: 10px; }
  .chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; }
  .chart .pt { fill: var(--accent); }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .link { display: block; text-align: center; text-decoration: none; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .sync { font-size: 12px; padding: 4px 9px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .sync.pend { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  .sync.ok { background: var(--ok-bg); color: var(--ok); }
  #setup input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px;
                 background: var(--card); color: var(--text); margin: 6px 0 12px; }
  body { padding-top: env(safe-area-inset-top); }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">Cargando…</div>

  <div id="setup" style="display:none">
    <h1>Configurar Gym</h1>
    <p class="muted">Solo se hace una vez. Lo más fácil es abrir el link de configuración que te mandé; si no, pega aquí los dos datos.</p>
    <div class="card">
      <div class="ex-title">URL de la API</div>
      <input id="cfgApi" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
      <div class="ex-title">Clave</div>
      <input id="cfgKey" placeholder="Clave secreta" autocomplete="off">
      <button class="save" style="width:100%" onclick="guardarConfig()">Guardar</button>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="top"><h1>Gym Martin</h1><span id="sync" class="sync"></span></div>
    <div class="sub" id="fecha"></div>

    <div class="tabs">
      <button id="tabReg" class="on" onclick="verTab('reg')">Registrar</button>
      <button id="tabRes" onclick="verTab('res')">Resumen</button>
    </div>

    <div id="vistaRes" style="display:none"></div>

    <div id="vistaReg">
      <div class="card" id="pesoCard">
        <div class="row between">
          <div>
            <div class="ex-title">Peso de hoy</div>
            <div class="muted" id="pesoInfo"></div>
          </div>
          <div class="row">
            <input id="peso" class="small-in" type="number" inputmode="decimal" step="0.1">
            <button class="save" style="flex:none;padding:10px 14px" onclick="guardarPeso()">✓</button>
          </div>
        </div>
        <div id="cinturaRow" class="row between" style="display:none;margin-top:12px">
          <div class="ex-title">Cintura (domingo)</div>
          <div class="row">
            <input id="cintura" class="small-in" type="number" inputmode="decimal" step="0.5" placeholder="cm">
            <button class="save" style="flex:none;padding:10px 14px" onclick="guardarCintura()">✓</button>
          </div>
        </div>
      </div>

      <div class="card" id="protCard"></div>

      <h2>Entrenamiento</h2>
      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
