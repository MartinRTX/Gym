<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F5F3FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0C14" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Inter (variable), guardada en la app para que funcione sin señal. Licencia: fonts/OFL.txt */
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url(fonts/inter.woff2) format('woff2'); }
  /* Tema claro: mismos acentos, un tono más profundo para que se lean sobre blanco */
  :root {
    --bg: #F5F3FA; --card: #FFFFFF; --card2: #F4F1FA; --text: #1A1530; --muted: #6B6680;
    --line: #E6E1F0; --pri: #6D3BE8; --pri-2: #8B5CF6; --pri-weak: #EFE9FD; --on-pri: #FFFFFF;
    --acc: #EA6A1F; --acc-weak: #FFF0E5; --on-acc: #FFFFFF;
    --ok: #16A34A; --ok-weak: #E4F6EC; --bad: #E11D48; --bad-weak: #FDE7EC;
    --cyan: #0891B2; --cyan-weak: #E0F5FA; --red: #E11D48; --red-weak: #FDE7EC;
    --g-pri: linear-gradient(90deg, #6D3BE8, #9B5CF6); --g-red: linear-gradient(90deg, #E11D48, #F43F5E);
    --g-cg: linear-gradient(90deg, #0891B2, #16A34A); --g-acc: linear-gradient(90deg, #EA6A1F, #F59E0B);
    --glow: rgba(109, 59, 232, .22); --on-cg: #FFFFFF;
    --shadow: 0 1px 2px rgba(40, 20, 90, .06), 0 4px 16px rgba(40, 20, 90, .05);
    --nav-h: 68px;
    --sat: max(env(safe-area-inset-top), var(--safe-area-inset-top, 0px));
    --sab: max(env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px));
  }
  /* Tema oscuro: la paleta de las capturas */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E0C14; --card: #18151F; --card2: #211D2D; --text: #EEEAF7; --muted: #A29CB6;
      --line: #2B2638; --pri: #9B7BFF; --pri-2: #B49CFF; --pri-weak: #2A2142; --on-pri: #0E0C14;
      --acc: #FF9A55; --acc-weak: #35231A; --on-acc: #1A0F07;
      --ok: #4ADE80; --ok-weak: #13291C; --bad: #F43F5E; --bad-weak: #36141E;
      --cyan: #06B6D4; --cyan-weak: #0B2A33; --red: #F43F5E; --red-weak: #36141E;
      --g-pri: linear-gradient(90deg, #7C5CFF, #B266FF); --g-red: linear-gradient(90deg, #F43F5E, #FB6F84);
      --g-cg: linear-gradient(90deg, #06B6D4, #4ADE80); --g-acc: linear-gradient(90deg, #FF9A55, #FFB46E);
      --glow: rgba(155, 123, 255, .28); --on-cg: #0E0C14;
      --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-feature-settings: "cv11", "ss01";
         padding-top: var(--sat); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 12px 16px calc(var(--nav-h) + 96px + var(--sab)); }
  .num { font-variant-numeric: tabular-nums; }

  /* Encabezado */
  .top { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 2px; }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .brand span { color: var(--pri); }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .sync { font-size: 12px; padding: 5px 10px; border-radius: 99px; background: var(--card2); color: var(--muted); white-space: nowrap; }
  .sync.pend { background: var(--acc-weak); color: var(--acc); font-weight: 700; }
  .sync.ok { background: var(--ok-weak); color: var(--ok); }

  /* Tarjetas y textos */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .muted { color: var(--muted); font-size: 13px; }
  .t1 { font-weight: 700; font-size: 16px; }
  .t2 { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  h2 { font-size: 12px; color: var(--muted); font-weight: 700; margin: 20px 4px 8px; text-transform: uppercase; letter-spacing: .08em; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; }
  .pill.acc { background: var(--acc-weak); color: var(--acc); }
  .pill.pri { background: var(--pri-weak); color: var(--pri); }
  .pill.ok { background: var(--ok-weak); color: var(--ok); }
  .pill.muted { background: var(--card2); color: var(--muted); }
  .btn { border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 16px; background: var(--pri); color: var(--on-pri); }
  .btn.ghost { background: var(--card2); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .btn.acc { background: var(--acc); color: var(--on-acc); }
  .btn.sm { padding: 9px 13px; font-size: 14px; border-radius: 11px; }
  .btn.block { width: 100%; }
  .icon { width: 20px; height: 20px; flex: none; }

  /* Peso compacto */
  .peso { display: flex; align-items: center; gap: 10px; }
  .peso .lbl { flex: 1; min-width: 0; }
  .in { width: 92px; padding: 11px 8px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 18px; font-weight: 700;
        text-align: center; background: var(--card2); color: var(--text); }
  .in:focus { outline: none; border-color: var(--pri); }
  .okmark { width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--pri); color: var(--on-pri); display: grid; place-items: center; }
  .done-card { border-color: transparent; background: var(--ok-weak); box-shadow: none; }
  .done-card .okmark { background: var(--ok); }

  /* Grupos */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
  .chip { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 9px 16px; font-weight: 600; font-size: 15px; }
  .chip.on { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
  .chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 9px; background: var(--acc); margin-left: 6px; vertical-align: middle; }

  /* Ejercicios */
  .ex { background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .ex-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .ex-ico { width: 38px; height: 38px; border-radius: 12px; background: var(--pri-weak); color: var(--pri); display: grid; place-items: center; flex: none; font-weight: 800; font-size: 14px; }
  .ex.done .ex-ico { background: var(--ok-weak); color: var(--ok); }
  .ex.prog .ex-ico { background: var(--acc-weak); color: var(--acc); }
  .ex-name { font-weight: 700; font-size: 15.5px; line-height: 1.25; }
  .ex-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ex.open { border-color: var(--pri); box-shadow: 0 0 0 1px var(--pri), var(--shadow); }
  .ex-body { padding: 0 16px 16px; }
  .tip { display: flex; gap: 8px; align-items: center; font-size: 13.5px; padding: 9px 12px; border-radius: 12px; background: var(--card2); color: var(--muted); margin: 2px 0 10px; }
  .tip.acc { background: var(--acc-weak); color: var(--acc); font-weight: 700; }
  .unit { display: flex; border: 1.5px solid var(--line); border-radius: 11px; overflow: hidden; flex: none; }
  .unit button { border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 700; padding: 7px 14px; min-width: 48px; }
  .unit button.on { background: var(--pri); color: var(--on-pri); }

  .sets-h { display: grid; grid-template-columns: 34px 58px 1fr 1fr 50px; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .06em; padding: 0 0 4px; text-align: center; }
  .set { display: grid; grid-template-columns: 34px 58px 1fr 1fr 50px; gap: 6px; align-items: center; margin-bottom: 8px; }
  .tipo { height: 50px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); font-weight: 800; font-size: 15px; }
  .tipo.C { color: var(--muted); background: var(--card2); font-size: 13px; }
  .tipo.D { color: var(--acc); background: var(--acc-weak); font-size: 13px; }
  .ant { height: 50px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 12.5px; line-height: 1.15; padding: 0 2px; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; }
  .setacts { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 8px; }
  .setacts .btn { padding-left: 6px; padding-right: 6px; white-space: nowrap; }
  .ant:active { background: var(--card2); }
  .val { height: 50px; border-radius: 12px; background: var(--card2); border: 1.5px solid var(--line); font-size: 21px; font-weight: 800; color: var(--text); width: 100%; }
  .val.vacio { color: var(--muted); font-size: 14px; font-weight: 600; }
  .chk { width: 50px; height: 50px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card2); color: var(--muted); display: grid; place-items: center; }
  .set.hecho .val { background: var(--pri-weak); border-color: transparent; }
  .set.hecho .chk { background: var(--pri); border-color: var(--pri); color: var(--on-pri); animation: pop .25s ease; }
  @keyframes pop { 50% { transform: scale(1.12); } }
  .more { margin-top: 6px; }
  .more summary { color: var(--muted); font-size: 13px; padding: 6px 0; list-style: none; }
  .more summary::before { content: "＋ "; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .pills button { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 11px; font-size: 13px; }
  .pills button.on { background: var(--pri); color: var(--on-pri); border-color: var(--pri); }
  textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; background: var(--card2); color: var(--text); font: inherit; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .acts .btn { flex: 1; }

  /* Sesión */
  .session { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 16px;
             background: linear-gradient(135deg, var(--pri), var(--pri-2)); color: var(--on-pri); margin-bottom: 12px; }
  .session b { font-size: 20px; }
  .session .btn { background: rgba(255,255,255,.18); color: inherit; }

  /* Temporizador de descanso: barra delgada sobre la navegación */
  .rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 30px + var(--sab));
          width: min(496px, calc(100% - 16px)); background: var(--card); color: var(--text); border: 1.5px solid var(--acc); border-radius: 16px; padding: 7px 8px 7px 12px;
          box-shadow: 0 8px 30px rgba(0,0,0,.25); z-index: 20; display: none; }
  .rest.show { display: block; animation: up .2s ease; }
  @keyframes up { from { transform: translate(-50%, 12px); opacity: 0; } }
  .rest .rrow { display: flex; align-items: center; gap: 6px; }
  .rest .rbtn { border: 0; background: var(--card2); color: inherit; border-radius: 10px; padding: 10px 0; font-weight: 700; font-size: 14px; flex: 1; min-width: 0; }
  .rest .rbtn.def { box-shadow: inset 0 0 0 2px var(--acc); color: var(--acc); }
  .rest > .rrow > .icon { color: var(--acc); }
  .rest .x { flex: none; width: 38px; }
  .rest .big { font-size: 22px; font-weight: 800; }
  .rest.fin { background: var(--acc); color: var(--on-acc); }
  .rest.fin .rbtn { background: rgba(255,255,255,.25); color: inherit; }
  .rbar { height: 3px; background: rgba(127,127,127,.3); border-radius: 9px; overflow: hidden; margin-top: 6px; }
  .rbar div { height: 100%; background: var(--acc); }

  /* Barra de sesión pegada arriba */
  .sesbar { position: sticky; top: var(--sat); z-index: 15; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px;
            border-radius: 14px; background: linear-gradient(135deg, #5B2FD0, #7444E8); color: #fff; margin: 0 0 12px; box-shadow: 0 4px 18px rgba(60,20,160,.25); }
  .sesbar .dotlive { width: 8px; height: 8px; border-radius: 9px; background: var(--acc); box-shadow: 0 0 0 4px rgba(255,138,61,.3); }
  .sesbar b { font-size: 16px; }
  .sesbar .btn { margin-left: auto; background: rgba(255,255,255,.2); color: #fff; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
  .buscar { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); font-size: 15px; margin-bottom: 10px; }
  .buscar:focus { outline: none; border-color: var(--pri); }
  .sug { display: flex; align-items: center; gap: 8px; font-size: 13.5px; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--pri-weak); color: var(--pri); margin: 2px 0 10px; font-weight: 600; }
  .sug .btn { margin-left: auto; padding: 7px 12px; font-size: 13px; border-radius: 9px; }

  /* Teclado numérico */
  .kp { position: fixed; inset: 0; background: rgba(10, 6, 25, .5); display: none; align-items: flex-end; justify-content: center; z-index: 55; }
  .kp.show { display: flex; }
  .kp .sheet { padding-top: 16px; }
  .kp .disp { font-size: 40px; font-weight: 800; text-align: center; padding: 4px 0 8px; letter-spacing: -.02em; }
  .kp .quick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }
  .kp .quick button { border: 0; border-radius: 12px; padding: 12px 0; font-weight: 800; font-size: 15px; background: var(--pri-weak); color: var(--pri); }
  .kp .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .kp .keys button { border: 0; border-radius: 14px; height: 54px; font-size: 22px; font-weight: 700; background: var(--card2); color: var(--text); }
  .kp .keys button:active, .kp .quick button:active { transform: scale(.96); }

  /* Ajustes */
  .opt { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .opt:first-of-type { border-top: 0; }
  .opt .txt { flex: 1; }
  .tog { width: 50px; height: 30px; border-radius: 99px; background: var(--line); border: 0; position: relative; flex: none; transition: background .2s; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 99px; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .tog.on { background: var(--pri); }
  .tog.on::after { left: 23px; }
  select { width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card2); color: var(--text); font-size: 15px; margin: 8px 0 4px; }

  /* Comida */
  .ring { display: grid; place-items: center; position: relative; width: 170px; height: 170px; margin: 4px auto 6px; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .v { font-size: 34px; font-weight: 800; }
  .foods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .food { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 12px; position: relative; }
  .food b { display: block; color: var(--pri); font-size: 15px; }
  .food .c { position: absolute; top: 8px; right: 10px; font-size: 12px; font-weight: 800; color: var(--acc); }
  .food.top { border-color: var(--pri); background: var(--pri-weak); }
  .eaten { display: flex; flex-wrap: wrap; gap: 6px; }
  .eaten button { border: 0; background: var(--card2); border-radius: 99px; padding: 6px 10px; font-size: 13px; color: var(--text); }

  /* Progreso */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .kpi .l { color: var(--muted); font-size: 12.5px; }
  .kpi .d { font-size: 12.5px; font-weight: 700; margin-top: 4px; color: var(--muted); }
  .kpi .d.good { color: var(--ok); }
  .week { display: flex; justify-content: space-between; margin-top: 12px; }
  .week div { width: 36px; text-align: center; font-size: 12px; color: var(--muted); }
  .week i { display: block; width: 30px; height: 30px; border-radius: 10px; margin: 0 auto 4px; background: var(--card2); border: 1.5px solid var(--line); }
  .week .y i { background: var(--pri); border-color: var(--pri); }
  .week .hoy { color: var(--text); font-weight: 800; }
  .rec { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .rec:first-of-type { border-top: 0; }
  .medal { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--acc-weak); color: var(--acc); flex: none; }
  .mus { padding: 11px 0; border-top: 1px solid var(--line); }
  .mus:first-of-type { border-top: 0; }
  .mbar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 7px; position: relative; }
  .mbar i { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--muted); opacity: .55; }
  .mbar div { height: 100%; border-radius: 99px; background: var(--pri); }
  .mbar div.ok { background: var(--ok); }
  .up { color: var(--ok); } .down { color: var(--bad); }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .ax { fill: var(--muted); font-size: 10px; }
  .chart .grid { stroke: var(--line); }
  .chart .avg { fill: none; stroke: var(--pri); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .chart .pt { fill: var(--pri); opacity: .28; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 14px; height: 4px; border-radius: 4px; background: var(--pri); vertical-align: middle; margin-right: 5px; }
  .legend i.p { width: 7px; height: 7px; opacity: .35; }

  /* Navegación inferior */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
         padding-bottom: var(--sab); z-index: 30; }
  .nav .in2 { max-width: 520px; margin: 0 auto; display: flex; height: var(--nav-h); }
  .nav button { flex: 1; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; }
  .nav button.on { color: var(--pri); }
  .nav button.on .icon { transform: scale(1.08); }

  /* Ventana de resumen de sesión */
  .modal { position: fixed; inset: 0; background: rgba(10, 6, 25, .55); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal.show { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 22px 18px calc(22px + var(--sab)); animation: up2 .25s ease; }
  @keyframes up2 { from { transform: translateY(40px); opacity: 0; } }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .stats div { background: var(--card2); border-radius: 14px; padding: 12px 8px; text-align: center; }
  .stats b { display: block; font-size: 22px; font-weight: 800; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 104px + var(--sab)); background: var(--text); color: var(--bg);
           padding: 10px 14px; border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60;
           width: max-content; max-width: min(460px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px; }
  .toast.show { opacity: 1; }
  .toast.act { pointer-events: auto; }
  .toast button { border: 0; background: transparent; color: var(--acc); font-weight: 800; font-size: 14px; padding: 4px 2px; flex: none; }
  .toast.pr { background: var(--acc); color: var(--on-acc); }
  .toast.pr button { color: var(--on-acc); text-decoration: underline; }
  #loading { text-align: center; padding: 80px 0; color: var(--muted); }
  #setup input { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; background: var(--card2); color: var(--text); margin: 6px 0 12px; }
  .hide { display: none !important; }

  /* v5 */
  .gear { width: 36px; height: 32px; border-radius: 10px; border: 0; background: var(--card2); color: var(--muted); display: grid; place-items: center; }
  .gear .icon { width: 18px; height: 18px; }
  .ex-ico svg.ring2 { width: 38px; height: 38px; transform: rotate(-90deg); }
  .ex-ico { position: relative; }
  .ex-ico .rt { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
  .ex.prog .ex-ico, .ex.open .ex-ico { background: transparent; }
  details.sec > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em; margin: 20px 4px 8px; cursor: pointer; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::after { content: "Ver ▾"; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--pri); font-weight: 700; }
  details.sec[open] > summary::after { content: "Ocultar ▴"; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--card2); border-radius: 14px; margin-bottom: 12px; border: 1px solid var(--line); }
  .seg button { border: 0; background: transparent; border-radius: 10px; padding: 9px 0; font-weight: 700; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--pri); box-shadow: var(--shadow); }
  .otro { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--acc-weak); color: var(--acc); font-weight: 700; margin-bottom: 12px; font-size: 14px; }
  .otro .btn { white-space: nowrap; margin-left: auto; background: var(--acc); color: var(--on-acc); padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .link { border: 0; background: none; color: var(--pri); font-weight: 700; font-size: 14px; padding: 0; }
  .aviso { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--pri-weak); color: var(--pri); margin-bottom: 12px; font-size: 14px; font-weight: 600; }
  .sstag { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 99px; background: var(--acc-weak); color: var(--acc); margin-left: 6px; vertical-align: 2px; }
  .platos { text-align: center; font-size: 13px; color: var(--muted); margin: -2px 0 8px; }
  .platos b { color: var(--text); }
  .pses { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .pses:first-of-type { border-top: 0; }
  .pses .ck { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--card2); border: 1.5px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 800; }
  .pses.ok .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
  .pses.ok .t1 { text-decoration: line-through; opacity: .6; }
  .count { font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .minis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .fotos img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; background: var(--card2); display: block; }
  .fotos div { font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }
  .comp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .comp img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; display: block; }
  .pesobtn { width: 92px; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 18px; font-weight: 800; background: var(--card2); color: var(--text); }
  .lista button { display: flex; width: 100%; text-align: left; align-items: center; gap: 10px; border: 0; border-top: 1px solid var(--line); background: none; padding: 13px 2px; font-size: 15px; color: var(--text); }
  .lista button:first-child { border-top: 0; }
  input[type=date] { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card2); color: var(--text); font-size: 16px; margin: 8px 0; }
  .sheet { max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">Cargando…</div>

  <div id="setup" class="hide">
    <div class="brand" style="margin:10px 0">Gym <span>·</span></div>
    <p class="muted">Solo se hace una vez. Lo más fácil es abrir el link de configuración; si no, pega aquí los dos datos.</p>
    <div class="card">
      <div class="t1">URL de la API</div>
      <input id="cfgApi" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
      <div class="t1">Clave</div>
      <input id="cfgKey" placeholder="Clave secreta" autocomplete="off">
      <button class="btn block" onclick="guardarConfig()">Guardar</button>
    </div>
  </div>

  <div id="app" class="hide">
    <div class="top"><div class="brand" id="brand">Gym</div><div class="row" style="gap:8px"><span id="sync" class="sync"></span><button class="gear" onclick="abrirAjustes()" aria-label="Ajustes"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div></div>
    <div class="sub" id="fecha"></div>
    <div id="vEntrenar"></div>
    <div id="vComida" class="hide"></div>
    <div id="vProgreso" class="hide"></div>
  </div>
</div>

<div class="rest" id="rest"></div>

<!-- Barra inferior: Entrenar va al centro; Coach y Ajustes aparecen a la derecha cuando la IA está activa -->
<nav class="nav hide" id="nav"><div class="in2">
  <button id="nComida" onclick="verTab('Comida')">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4 0-7-3.5-7-8 0-3.5 2.2-6 5-6 1 0 1.5.5 2 .5s1-.5 2-.5c2.8 0 5 2.5 5 6 0 4.5-3 8-7 8z"/><path d="M12 7c0-2 1-3.5 3-4"/></svg>Comida</button>
  <button id="nProgreso" onclick="verTab('Progreso')">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>Progreso</button>
  <button id="nEntrenar" class="on centro" onclick="verTab('Entrenar')" aria-label="Entrenar">
    <span class="bola"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg></span>Entrenar</button>
  <button id="nAjustes" class="hide" onclick="abrirAjustes()">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</div></nav>

<div class="kp" id="kp" onclick="if(event.target===this)cerrarTeclado()"><div class="sheet" id="kpSheet"></div></div>
<div class="modal" id="modal" onclick="if(event.target===this)cerrarModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
