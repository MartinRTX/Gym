# Compila el APK de la app Gym en los servidores de GitHub (no necesitas Android Studio).
# Se corre solo cuando cambias algo en la carpeta apk/ o este archivo, o a mano desde la pestaña Actions.
# Resultado: en "Releases" del repo aparece Gym.apk para instalar desde el celular.
name: APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Ícono de la app
        run: |
          mkdir -p assets
          cp ../icon-512.png assets/icon-only.png || true
          cp ../icon-512.png assets/splash.png || true
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#0E0C14' --iconBackgroundColorDark '#0E0C14' \
            --splashBackgroundColor '#0E0C14' --splashBackgroundColorDark '#0E0C14' \
            || echo "No se pudo generar el ícono; se queda el de Capacitor"

      - name: Permiso para el dictado por voz (Android 11+ necesita ver el servicio de reconocimiento)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.speech.RecognitionService' "$M" || sed -i 's#<application#<queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application#' "$M"
          grep -n "queries" "$M"

      - name: Número de versión (sube solo en cada compilación)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"5.9.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar
        working-directory: apk/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Firmar
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "Faltan los secretos KEYSTORE_B64 y KEYSTORE_PASS"; exit 1; fi
          echo "$KS_B64" | base64 -d > gym.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alineado.apk
          "$BT/apksigner" sign --ks gym.jks --ks-key-alias gym --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Gym.apk alineado.apk
          "$BT/apksigner" verify Gym.apk
          rm -f gym.jks

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create apk Gym.apk --repo "${{ github.repository }}" \
            --title "App Gym para Android" \
            --notes "Descarga Gym.apk desde el celular e instálala. Compilación ${{ github.run_number }}. Las mejoras de la app llegan solas por GitHub Pages; solo vuelves a instalar si cambia la carpeta apk/."
