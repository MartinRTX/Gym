# Compila el APK de la app Gym en los servidores de GitHub (no necesitas Android Studio).
# Se corre solo cuando cambias algo en la carpeta apk/ o este archivo, o a mano desde la pestaña Actions.
# Resultado: en "Releases" del repo aparece Gym.apk para instalar desde el celular (solo desde main;
# en otras ramas queda como artefacto de prueba y no reemplaza el APK que instalas).
# Siempre se firma con la misma keystore (secretos KEYSTORE_B64 / KEYSTORE_PASS, alias gym): se instala encima.
name: APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Health Connect solo lectura y minSdk 26
        run: node preparar-android.js

      - name: Ícono de la app
        run: |
          mkdir -p assets
          cp ../icon-512.png assets/icon-only.png || true
          cp ../icon-512.png assets/splash.png || true
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#0E0C14' --iconBackgroundColorDark '#0E0C14' \
            --splashBackgroundColor '#0E0C14' --splashBackgroundColorDark '#0E0C14' \
            || echo "No se pudo generar el ícono; se queda el de Capacitor"

      - name: Permiso para el dictado por voz (Android 11+ necesita ver el servicio de reconocimiento)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.speech.RecognitionService' "$M" || sed -i 's#<application#<queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application#' "$M"
          grep -n "queries" "$M"

      - name: Número de versión (sube solo en cada compilación)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"7.5.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar
        working-directory: apk/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Firmar
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "Faltan los secretos KEYSTORE_B64 y KEYSTORE_PASS"; exit 1; fi
          echo "$KS_B64" | base64 -d > gym.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alineado.apk
          "$BT/apksigner" sign --ks gym.jks --ks-key-alias gym --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Gym.apk alineado.apk
          "$BT/apksigner" verify Gym.apk
          rm -f gym.jks
          # La misma firma de siempre: si cambiara, Android no dejaría instalar encima (habría que desinstalar)
          CERT=$("$BT/apksigner" verify --print-certs Gym.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "Certificado: $CERT"
          if [ "$CERT" != "0c4ca3eb0e1e8e8f0a00f3be174033c7a8572dbed4871b5a121d3a044ca868a6" ]; then echo "La firma NO es la de siempre"; exit 1; fi

      - name: Revisar permisos (Health Connect solo lectura de pasos, distancia, sueño y ejercicio, también en segundo plano)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SALUD=$("$BT/aapt" dump permissions Gym.apk | grep -o "android.permission.health.[A-Z0-9_]*" | sort -u || true)
          echo "$SALUD"
          DE_MAS=$(echo "$SALUD" | grep -v -E "health\.READ_(STEPS|DISTANCE|SLEEP|EXERCISE|HEALTH_DATA_IN_BACKGROUND)$" | grep . || true)
          if [ -n "$DE_MAS" ]; then echo "Permisos de salud que no deben estar: $DE_MAS"; exit 1; fi

      - name: Guardar el APK de prueba (ramas que no son main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Gym-apk-prueba
          path: apk/Gym.apk
          retention-days: 7

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create apk Gym.apk --repo "${{ github.repository }}" \
            --title "App Gym para Android" \
            --notes "Descarga Gym.apk desde el celular e instálala. Compilación ${{ github.run_number }}. Las mejoras de la app llegan solas por GitHub Pages; solo vuelves a instalar si cambia la carpeta apk/."
