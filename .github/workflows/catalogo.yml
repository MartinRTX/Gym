# Arma el catálogo de alimentos (datos/) con las tablas de México (INCMNSZ / BAM) en los servidores de GitHub,
# que sí tienen acceso a esas páginas. Corre al cambiar este archivo o herramientas/catalogo*, o a mano desde Actions.
name: Catálogo de alimentos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/catalogo.yml'
      - 'herramientas/catalogo*'

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Explorar la API de CONABIO (3)
        run: |
          set +e
          G=https://nutricion-siagro.conabio.gob.mx/graphql
          q() { curl -sS --max-time 60 -H 'Content-Type: application/json' -d "$1" "$G" | head -c ${2:-4000}; echo; }
          echo "=== campos de Query"; q '{"query":"{__schema{queryType{fields{name args{name}}}}}"}' 6000
          echo "=== tipos"; q '{"query":"{__schema{types{name kind fields{name}}}}"}' 12000
          echo "=== meta_query"; curl -sS --max-time 30 https://nutricion-siagro.conabio.gob.mx/nutricion-graphql/meta_query | head -c 600; echo
          pip -q install pypdf >/dev/null 2>&1
          for f in Diccionario_datos Detalles_tecnicos; do
            curl -sSL --max-time 60 https://siagro.conabio.gob.mx/nutricion/download/$f.pdf -o $f.pdf
            python3 -c "import pypdf,sys;r=pypdf.PdfReader('$f.pdf');print('\n'.join((p.extract_text() or '') for p in r.pages)[:7000])"
          done
