# Arma el catálogo de alimentos (datos/) con las tablas de México (INCMNSZ / BAM) en los servidores de GitHub,
# que sí tienen acceso a esas páginas. Corre al cambiar este archivo o herramientas/catalogo*, o a mano desde Actions.
name: Catálogo de alimentos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/catalogo.yml'
      - 'herramientas/catalogo*'

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar los archivos de descarga (2)
        run: |
          set +e
          echo "=== listado download/"; curl -sSL -A "Mozilla/5.0" --max-time 40 https://siagro.conabio.gob.mx/nutricion/download/ | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' | head -60
          echo "=== SPA"; curl -sSL -A "Mozilla/5.0" --max-time 40 https://nutricion-siagro.conabio.gob.mx/spa -o spa.html -w "HTTP %{http_code} %{size_download}\n"; head -c 3000 spa.html; echo
          for js in $(grep -oE '(src|href)="[^"]+\.js"' spa.html | cut -d'"' -f2); do
            case "$js" in http*) u="$js";; /*) u="https://nutricion-siagro.conabio.gob.mx$js";; *) u="https://nutricion-siagro.conabio.gob.mx/spa/$js";; esac
            echo "--- $u"; curl -sSL --max-time 40 "$u" -o b.js -w "HTTP %{http_code} %{size_download}\n"
            grep -oE '"(https?:)?/[^"]{0,80}(api|graphql|registro|alimento|descarga|download|export|csv|xlsx)[^"]{0,60}"' b.js | sort -u | head -40
            grep -oE "https?://[a-zA-Z0-9./_-]+" b.js | sort -u | head -40
          done
          echo "=== datos.gob.mx"
          curl -sSL --max-time 40 "https://datos.gob.mx/busca/api/3/action/package_search?q=composicion%20alimentos&rows=10" | head -c 3000; echo
          curl -sSL --max-time 40 "https://www.datos.gob.mx/api/3/action/package_search?q=alimentos%20nutrimentos&rows=10" | head -c 3000; echo
          echo "=== INSP BAM links"
          curl -sSL -A "Mozilla/5.0" --max-time 40 https://www.insp.mx/informacion-relevante/bam-bienvenida | grep -oiE 'https?://[^"<> ]*(bam|base-de-alimentos|alimentos)[^"<> ]*' | sort -u | head -40
